[tool.poetry]
name = "job-parser"
version = "0.1.0"
description = "Job parser"
authors = ["jarkotusich"]

packages = [
    { include = "src", from = "." }
]

[tool.poetry.dependencies]
python = ">=3.12,<3.13"
ipykernel = "^6.29.5"
python-dotenv = "^1.0.1"
hydra-core = { version = "^1.3.2", optional = true }
numpy = "^1.26.4"
pandas = "^2.2.2"
scipy = "^1.13.1"
polars = "^1.6.0"
boto3 = "^1.34.157"
sqlalchemy = "^2.0.32"
psycopg2-binary = "^2.9.9"
connectorx = "^0.4.4"
pydantic = "^2.11.9"
pydantic-settings = "v2.10.1"
joblib = "^1.4.2"
pyyaml = "^6.0.2"
pyarrow = "^20.0.0"

[tool.poetry.group.dev.dependencies]
jupyterlab = "^4.0.0"
jupyterlab-lsp = "^5.0.0"
python-lsp-server = {extras = ["all"], version = "^1.0.0"}
jedi = "^0.19"
ipywidgets = "^8.1.5"
widgetsnbextension = "^4.0.11"
ydata-profiling = "^4.0.0"
ruff = "^0.12.12"
mypy = "^1.4.1"
pytest = "^7.4.2"
pytest-cov = "^4.1.0"
pre-commit = "^3.4.0"

[tool.poetry.extras]
dev = []

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
